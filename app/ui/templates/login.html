{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-24 bg-white border border-stone-200 rounded-lg p-6">
  <h1 class="text-lg font-semibold mb-4">Log in</h1>
  {% if error %}<p class="text-sm text-red-700 mb-3">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="space-y-3">
    <input type="password" name="password" placeholder="Password" required autofocus
           class="w-full border border-stone-300 rounded px-3 py-2">
    <button class="w-full bg-stone-900 text-white rounded px-3 py-2">Log in</button>
  </form>
</div>
{% endblock %}
